<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generate ZIP Download</title>
  <script src="./jszip.min.js"></script>
  <style>
    :root {
      --delay: 5s;
      --bg-1: #eef2ff;
      --bg-2: #fdf2f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --on-accent: #ffffff;
      --track: #e5e7eb;
      --chip: #f3f4f6;
      --shadow: 0 24px 60px rgba(79, 70, 229, 0.15), 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-1: #0f172a;
        --bg-2: #1e1b4b;
        --card: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #818cf8;
        --accent-hover: #a5b4fc;
        --on-accent: #0f172a;
        --track: #334155;
        --chip: #0f172a;
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 40px 32px 32px;
      text-align: center;
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      font-weight: 700;
    }

    p {
      margin: 0;
      line-height: 1.5;
      text-wrap: balance;
      color: var(--muted);
    }

    .chip {
      display: inline-block;
      margin: 20px 0 28px;
      padding: 6px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      color: var(--muted);
      background: var(--chip);
      border-radius: 999px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: var(--on-accent);
      background: var(--accent);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      outline-offset: 3px;
    }

    .progress {
      height: 6px;
      margin-top: 24px;
      overflow: hidden;
      background: var(--track);
      border-radius: 999px;
      visibility: hidden;
    }

    .progress.active {
      visibility: visible;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: var(--accent);
      border-radius: inherit;
    }

    .progress.active .progress-bar {
      animation: fill var(--delay) linear forwards;
    }

    @keyframes fill {
      to {
        width: 100%;
      }
    }

    .status {
      min-height: 1.5em;
      margin-top: 12px;
      font-size: 0.9rem;
    }

    .counter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 20px;
      font-size: 0.9rem;
      color: var(--muted);
      border-top: 1px solid var(--track);
    }

    .counter strong {
      min-width: 2.5em;
      padding: 4px 12px;
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      border-radius: 999px;
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 8v13H3V8"/>
        <path d="M1 3h22v5H1z"/>
        <path d="M10 12h4"/>
      </svg>
    </div>

    <h1>Download your files</h1>
    <p>Get a ZIP with a freshly generated text file inside.</p>
    <span class="chip">generated-files.zip</span>

    <button onclick="downloadZip()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Download ZIP
    </button>

    <div id="progress" class="progress" aria-hidden="true">
      <div class="progress-bar"></div>
    </div>
    <p id="status" class="status" aria-live="polite"></p>

    <div class="counter">
      <span>Download requests</span>
      <strong id="request-count">0</strong>
    </div>
  </main>

  <script>
    const DELAY_SECONDS = 5;

    // Each click gets its own download; the progress bar and status follow the newest click
    let latestClick = 0;
    let pending = 0;

    async function downloadZip() {
      const progress = document.getElementById("progress");
      const status = document.getElementById("status");
      const click = ++latestClick;
      pending++;

      // Show how many times a download has been requested
      document.getElementById("request-count").textContent = click;

      // Restart the progress bar animation
      progress.style.setProperty("--delay", `${DELAY_SECONDS}s`);
      progress.classList.remove("active");
      void progress.offsetWidth;
      progress.classList.add("active");

      const zip = new JSZip();

      // Generate text content
      const content = `Hello!
This is a dynamically generated text file.
Generated on: ${new Date().toLocaleString()}`;

      // Add text file to ZIP
      zip.file("sample.txt", content);

      // Generate ZIP
      const blob = await zip.generateAsync({
        type: "blob"
      });

      // Wait 5 seconds before starting the download, counting down on screen
      for (let s = DELAY_SECONDS; s > 0; s--) {
        if (click === latestClick) {
          const queued = pending > 1 ? ` (${pending} queued)` : "";
          status.textContent = `Your download will start in ${s}…${queued}`;
        }
        await new Promise(resolve => setTimeout(resolve, 1000));
      }

      // Trigger download
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "generated-files.zip";
      link.click();

      URL.revokeObjectURL(url);

      pending--;
      if (click === latestClick) {
        status.textContent = "Download started. Check your downloads folder.";
      }
    }
  </script>

</body>
</html>
